<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BetterSearch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #1A1A1A;
    --ink-muted: #5C5C5C;
    --rule: #E4E4E4;
    --rule-strong: #C9C9C9;
    --accent: #1F4B3F;
    --miss: #8A8A8A;

    --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
    --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

    --serif: 'Lora', Georgia, serif;
    --sans: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: var(--s7) var(--s5) var(--s8); }

  header { margin-bottom: var(--s6); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; margin: 0 0 var(--s2); }
  .lede { color: var(--ink-muted); margin: 0; max-width: 62ch; }

  form { display: flex; gap: var(--s3); margin: var(--s6) 0 var(--s2); flex-wrap: wrap; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: var(--s2); }
  .field { flex: 1 1 380px; }

  input[type="search"] {
    width: 100%; padding: var(--s3) var(--s4);
    font-family: var(--sans); font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 3px;
  }
  input[type="search"]:focus-visible,
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .submit { align-self: flex-end; }
  button {
    padding: var(--s3) var(--s5); font-family: var(--sans); font-size: 16px; font-weight: 600;
    color: #FFFFFF; background: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px; cursor: pointer;
  }
  button[disabled] { opacity: .5; cursor: default; }

  .examples { margin: 0 0 var(--s6); color: var(--ink-muted); font-size: 14px; }
  .examples button {
    background: none; color: var(--accent); border: 0; border-bottom: 1px solid var(--rule-strong);
    padding: 0 0 1px; margin: 0 var(--s3) var(--s2) 0; font-weight: 400; font-size: 14px;
  }

  .status { min-height: 24px; color: var(--ink-muted); font-size: 14px; margin-bottom: var(--s4); }
  .status[data-error="true"] { color: #8A2A2A; }

  .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s5); }
  @media (max-width: 900px) { .columns { grid-template-columns: 1fr; } }

  .column { border-top: 2px solid var(--ink); padding-top: var(--s3); }
  .column h2 {
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    text-transform: uppercase; margin: 0 0 var(--s1);
  }
  .column p.what { color: var(--ink-muted); font-size: 13px; margin: 0 0 var(--s4); min-height: 3em; }

  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: var(--s3) 0; border-bottom: 1px solid var(--rule); }
  li:last-child { border-bottom: 0; }

  .row { display: flex; gap: var(--s3); align-items: baseline; }
  .score { font-family: var(--mono); font-size: 13px; color: var(--ink-muted); min-width: 5.5ch; }
  .title { font-family: var(--serif); font-weight: 500; font-size: 16px; }
  .snippet { color: var(--ink-muted); font-size: 14px; margin: var(--s1) 0 0 calc(5.5ch + var(--s3)); }

  .empty { color: var(--miss); font-style: italic; padding: var(--s4) 0; }

  footer { margin-top: var(--s8); padding-top: var(--s5); border-top: 1px solid var(--rule);
           color: var(--ink-muted); font-size: 14px; }
  footer code { font-family: var(--mono); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>BetterSearch</h1>
    <p class="lede">
      The same query, run three ways over the same 112 documents. Keyword search
      ranks by shared words; semantic search ranks by meaning. Try a query whose
      wording appears nowhere in the content.
    </p>
  </header>

  <form id="search-form">
    <div class="field">
      <label for="query">Search query</label>
      <input type="search" id="query" name="query" value="Norman conquest"
             autocomplete="off" spellcheck="false" />
    </div>
    <div class="submit">
      <button type="submit" id="go">Search</button>
    </div>
  </form>

  <p class="examples">
    Try:
    <button type="button" data-q="Norman conquest">Norman conquest</button>
    <button type="button" data-q="why does bread rise">why does bread rise</button>
    <button type="button" data-q="the ship that sank on its maiden voyage">the ship that sank on its maiden voyage</button>
    <button type="button" data-q="father of genetics">father of genetics</button>
    <button type="button" data-q="drugs that stop working">drugs that stop working</button>
  </p>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="columns" id="columns"></div>

  <footer id="footer"></footer>

</div>

<script>
  const MODES = [
    ["keyword",  "BM25 term overlap. Cannot find a document that does not share your words."],
    ["semantic", "Cosine similarity over embeddings. Matches meaning rather than vocabulary."],
    ["hybrid",   "Reciprocal rank fusion of the other two columns."]
  ];

  const columnsEl = document.getElementById("columns");
  const statusEl  = document.getElementById("status");
  const formEl    = document.getElementById("search-form");
  const queryEl   = document.getElementById("query");
  const goEl      = document.getElementById("go");

  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));

  function renderColumn(mode, blurb, results) {
    const items = results.length
      ? `<ol>${results.map((r) => `
          <li>
            <div class="row">
              <span class="score">${r.score.toFixed(3)}</span>
              <span class="title">${escapeHtml(r.title)}</span>
            </div>
            <p class="snippet">${escapeHtml(r.snippet.slice(0, 150))}&hellip;</p>
          </li>`).join("")}</ol>`
      : `<p class="empty">No results &mdash; no document shares these terms.</p>`;

    return `<section class="column">
        <h2>${mode}</h2>
        <p class="what">${blurb}</p>
        ${items}
      </section>`;
  }

  async function run(query) {
    if (!query.trim()) return;
    goEl.disabled = true;
    statusEl.dataset.error = "false";
    statusEl.textContent = "Searching…";
    try {
      const res = await fetch("/compare", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, top_k: 5 })
      });
      const payload = await res.json();
      if (payload.status !== "success") throw new Error(payload.message || "Request failed");

      columnsEl.innerHTML = MODES
        .map(([mode, blurb]) => renderColumn(mode, blurb, payload.data.modes[mode].results))
        .join("");

      const keywordHits = payload.data.modes.keyword.results.length;
      statusEl.textContent = keywordHits === 0
        ? `Keyword search returned nothing for “${query}”. Semantic search found ${payload.data.modes.semantic.results.length} results.`
        : `Results for “${query}”.`;
    } catch (err) {
      statusEl.dataset.error = "true";
      statusEl.textContent = err.message;
    } finally {
      goEl.disabled = false;
    }
  }

  formEl.addEventListener("submit", (e) => { e.preventDefault(); run(queryEl.value); });

  document.querySelectorAll(".examples button").forEach((b) => {
    b.addEventListener("click", () => { queryEl.value = b.dataset.q; run(b.dataset.q); });
  });

  fetch("/health").then((r) => r.json()).then((p) => {
    const i = p.data.index;
    document.getElementById("footer").innerHTML =
      `${i.chunk_count} chunks indexed &middot; provider <code>${escapeHtml(p.data.embedding_provider)}</code>` +
      ` &middot; model <code>${escapeHtml(i.model_id || "none")}</code>` +
      ` &middot; ${i.dimensions} dims &middot; <code>${escapeHtml(i.backend)}</code> backend`;
  }).catch(() => {});

  run(queryEl.value);
</script>
</body>
</html>
