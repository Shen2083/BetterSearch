# Render blueprint. Deploy with: New > Blueprint > point at this repo.
#
# Three things here are easy to get wrong and expensive to debug:
#
# 1. CPU-only torch is installed FIRST. The default torch wheel drags in ~2.7GB
#    of NVIDIA CUDA packages that are dead weight on a CPU host and will blow
#    the build image size.
#
# 2. `bettersearch ingest` runs in the BUILD command, not at startup. Render's
#    filesystem is ephemeral and .bettersearch/ is gitignored, so an index built
#    at runtime would vanish. Built here, it is baked into the deployed image.
#
# 3. plan: standard is deliberate. The default local encoder, bge-base-en-v1.5,
#    needs ~1.13GB resident (measured, peak RSS after a warm query); free and
#    starter are 512MB and will OOM. all-MiniLM-L6-v2 needs ~847MB - still too
#    big for starter, so it saves nothing here, and it costs 0.079 nDCG. If the
#    standard plan is unwelcome, switch to an API embedding provider instead
#    (see the alternative service below) - that runs in ~32MB because only the
#    query is embedded at request time.
services:
  - type: web
    name: bettersearch
    runtime: python
    plan: standard
    region: frankfurt
    healthCheckPath: /health
    buildCommand: |
      pip install --upgrade pip
      pip install torch --index-url https://download.pytorch.org/whl/cpu
      pip install -e ".[local,api]"
      bettersearch ingest --corpus data/corpus_seed.json
      # Fetch the reranker now, for the same reason ingest runs here: a model
      # downloaded on the first search makes one unlucky reader wait for it.
      # Skipped cleanly if reranking is turned off for this service.
      python -c "import os;m=os.environ.get('BETTERSEARCH_RERANK','cross-encoder/ms-marco-MiniLM-L-6-v2').strip();m and __import__('sentence_transformers').CrossEncoder(m)"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: BETTERSEARCH_EMBEDDING_PROVIDER
        value: local
      - key: BETTERSEARCH_INDEX
        value: numpy
      # Keep the model cache inside the build so the first request is not
      # waiting on a HuggingFace download.
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
      # Reranking reorders the retrieved candidates with a cross-encoder, worth
      # nDCG@10 0.6582 -> 0.7280 on the judged corpus. It is ON by default in
      # api/catalogue.py; set this to an empty string to turn it off.
      #
      # **It only runs where the records have prose to read.** A cross-encoder
      # on a bare catalogue record is measured at +0.005 - a 24-word stub gives
      # a passage model nothing to read - so records absent from the enrichment
      # store keep their retrieval position. The stores are paired:
      # corpus_seed.json with enrichment_seed.jsonl, catalogue_real.json with
      # enrichment_real_haiku.jsonl, and catalogue_library.json has none. A
      # mismatch is not an error; the service logs that reranking is inert and
      # carries on.
      - key: BETTERSEARCH_ENRICHMENT
        value: data/enrichment_seed.jsonl

